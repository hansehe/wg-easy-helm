version: '3.8'

# https://github.com/wg-easy/wg-easy
# v15: https://wg-easy.github.io/wg-easy/latest/getting-started/
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    hostname: wg-easy
    ports:
      - 51820:51820/udp # VPN port
      - 8282:51821/tcp # UI port - access at http://localhost:8282
    environment:
      - INSECURE=true
      - INIT_ENABLED=true
      - INIT_USERNAME=admin
      - INIT_PASSWORD=password
      - INIT_HOST=localhost
      - INIT_PORT=51820
    volumes:
      - wg_easy_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks:
      - backend_network
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  wg_easy_data:

networks:
  backend_network:
